  <line x1="30" y1="66" x2="98" y2="66" stroke="#10b981" stroke-width="2" opacity="0.7"/>
  <path d="M 35 50 Q 64 56 93 50" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.7"/>
  <path d="M 35 82 Q 64 76 93 82" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.7"/>
  <!-- Location Pin -->
  <path d="M 80 26 C 72 26 66 32 66 40 C 66 51 80 64 80 64 C 80 64 94 51 94 40 C 94 32 88 26 80 26 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="2"/>
